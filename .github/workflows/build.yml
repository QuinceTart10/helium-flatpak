name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flatpak:
    name: "Build app"
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-26.08
      options: --privileged
    strategy:
      matrix:
        variant:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.variant.runner }}
    steps:
      - uses: actions/checkout@v7
      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          build-bundle: false
          keep-build-dirs: true
          manifest-path: flatpak/net.imput.helium.yaml
          arch: ${{ matrix.variant.arch }}
      - run: tar cf build-${{ matrix.variant.arch }}.tar -C flatpak_app .
      - uses: actions/upload-artifact@v7
        with:
          name: build-${{ matrix.variant.arch }}.tar
          path: build-${{ matrix.variant.arch }}.tar
          archive: false
  combine:
    name: "Build repo and sign"
    runs-on: ubuntu-24.04-arm # arm builders are slightly faster ;)
    needs: flatpak
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*.tar
      - name: "Install dependencies"
        run: sudo apt install -y flatpak ostree
      - name: "Import signing key"
        env:
          GPG_KEY: ${{ secrets.GPG_KEY }}
        run: echo -n "$GPG_KEY" | gpg --import
      - name: "Build and sign repo"
        run: |
          flatpak build-export --collection-id=zip.privacyslop.helium --gpg-sign=A54D5ADD2CA0971F repo build-aarch64.tar
          flatpak build-export --collection-id=zip.privacyslop.helium --gpg-sign=A54D5ADD2CA0971F repo build-x86_64.tar
      - uses: actions/upload-artifact@v7
        with:
          path: repo
